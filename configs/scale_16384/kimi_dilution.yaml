# 209M x 16K, kimi_dilution: Kimi Linear's layer pattern with dilution attention in its attention slots.
# Published 16K recipe (public DilutionAttention configs/scale_16384/all_dilution_nope.yaml), no BOS, the
# 128,174-step cosine run to step 64,000. Parameters 208,514,136 (published 208,540,416; -0.013%) with SwiGLU width 1977.
model:
  vocab_size: 50304
  n_layers: 24
  d_model: 768
  n_heads: 12
  context_length: 16384
  positional: none
  rope_theta: 500000
  bias: false
  mlp: swiglu
  attention: dilution
  layer_attention:
  - kda
  - kda
  - kda
  - dilution
  - kda
  - kda
  - kda
  - dilution
  - kda
  - kda
  - kda
  - dilution
  - kda
  - kda
  - kda
  - dilution
  - kda
  - kda
  - kda
  - dilution
  - kda
  - kda
  - kda
  - dilution
  ffn_hidden: 1977
data:
  synthetic: false
  vocab_size: 50304
  train_path: data/fineweb_edu_100bt_40b/train.bin
  val_path: data/fineweb_edu_100bt_40b/val.bin
  train_tokens: 40000000000
  val_tokens: 20000000
  seed: 1337
training:
  device: auto
  dtype: auto
  compile: true
  batch_size: 2
  sequence_length: 16384
  gradient_accumulation_steps: 2
  max_steps: 128174
  learning_rate: 0.0006
  min_lr_ratio: 0.1
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0
  fused_optimizer: true
  log_interval: 25
  eval_interval: 1000
  eval_batches: 8
  checkpoint_interval: 1000
  seed: 1337
  output_dir: runs/scale_16384/kimi_dilution
